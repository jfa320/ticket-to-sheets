services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturas-app
    environment:
      SERVER_ADDRESS: 0.0.0.0
      APP_OCR_ENDPOINT: http://paddleocr:5000/ocr
      APP_OCR_HEALTH_ENDPOINT: http://paddleocr:5000/health
      APP_OCR_LANGUAGE: es
      APP_OCR_SEARCH_BUDGET_SECONDS: ${APP_OCR_SEARCH_BUDGET_SECONDS:-8}
      APP_PDF_PROCESSING_BUDGET_SECONDS: ${APP_PDF_PROCESSING_BUDGET_SECONDS:-300}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID:-}
      APP_GOOGLE_CLIENT_SECRET: ${APP_GOOGLE_CLIENT_SECRET:-}
      APP_GOOGLE_PICKER_API_KEY: ${APP_GOOGLE_PICKER_API_KEY:-}
      APP_GOOGLE_APP_ID: ${APP_GOOGLE_APP_ID:-}
      APP_GOOGLE_REDIRECT_URI: ${APP_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/sheets/oauth/callback}
      APP_GOOGLE_TOKENS_PATH: /app/data/google-oauth-tokens.json
      APP_SHEETS_CONFIG_PATH: /app/data/sheets-config.json
      APP_SHEETS_HISTORY_PATH: /app/data/sheets-history.json
      APP_SHEETS_TIMEOUT_MS: ${APP_SHEETS_TIMEOUT_MS:-15000}
      TZ: America/Argentina/Buenos_Aires
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      paddleocr:
        condition: service_healthy
    restart: unless-stopped

  paddleocr:
    build:
      context: .
      dockerfile: ocr/Dockerfile
    container_name: facturas-paddleocr
    environment:
      OCR_DEFAULT_LANGUAGE: es
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-4}
      OCR_ENABLE_MKLDNN: ${OCR_ENABLE_MKLDNN:-true}
      OCR_BIND_HOST: 0.0.0.0
      TZ: America/Argentina/Buenos_Aires
      FLAGS_use_mkldnn: "0"
      FLAGS_use_onednn: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      APP_OCR_DEBUG: ${APP_OCR_DEBUG:-false}
      OCR_IMAGE_CORRECTIONS: ${OCR_IMAGE_CORRECTIONS:-true}
      OCR_TARGETED_RETRY: ${OCR_TARGETED_RETRY:-true}
      OCR_VARIANT_FUSION: ${OCR_VARIANT_FUSION:-true}
      OCR_ADAPTIVE_SEARCH: ${OCR_ADAPTIVE_SEARCH:-true}
      OCR_SEARCH_BUDGET_SECONDS: ${OCR_SEARCH_BUDGET_SECONDS:-90}
      OCR_DEBUG_DIR: /app/debug
    expose:
      - "5000"
    volumes:
      - paddleocr-cache:/root/.paddleocr
      - ./debug:/app/debug
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3); raise SystemExit(0 if json.load(response).get('ocrReady') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    restart: unless-stopped

volumes:
  paddleocr-cache:
