services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturas-app
    environment:
      APP_OCR_ENDPOINT: http://paddleocr:5000/ocr
      APP_OCR_HEALTH_ENDPOINT: http://paddleocr:5000/health
      APP_OCR_LANGUAGE: es
      APP_SHEETS_CREDENTIALS_PATH: ${APP_SHEETS_CREDENTIALS_PATH:-/app/data/google-service-account.json}
      APP_SHEETS_CONFIG_PATH: /app/data/sheets-config.json
      APP_SHEETS_HISTORY_PATH: /app/data/sheets-history.json
      APP_SHEETS_TIMEOUT_MS: ${APP_SHEETS_TIMEOUT_MS:-15000}
      TZ: America/Argentina/Buenos_Aires
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      paddleocr:
        condition: service_healthy
    restart: unless-stopped

  paddleocr:
    build:
      context: .
      dockerfile: ocr/Dockerfile
    container_name: facturas-paddleocr
    environment:
      OCR_DEFAULT_LANGUAGE: es
      TZ: America/Argentina/Buenos_Aires
      FLAGS_use_mkldnn: "0"
      FLAGS_use_onednn: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      APP_OCR_DEBUG: ${APP_OCR_DEBUG:-false}
      OCR_IMAGE_CORRECTIONS: ${OCR_IMAGE_CORRECTIONS:-true}
      OCR_TARGETED_RETRY: ${OCR_TARGETED_RETRY:-true}
      OCR_VARIANT_FUSION: ${OCR_VARIANT_FUSION:-true}
      OCR_DEBUG_DIR: /app/debug
    expose:
      - "5000"
    volumes:
      - paddleocr-cache:/root/.paddleocr
      - ./debug:/app/debug
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3); raise SystemExit(0 if json.load(response).get('ocrReady') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    restart: unless-stopped

volumes:
  paddleocr-cache:
