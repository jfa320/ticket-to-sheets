services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturas-app
    environment:
      APP_OCR_ENDPOINT: http://paddleocr:5000/ocr
      APP_OCR_HEALTH_ENDPOINT: http://paddleocr:5000/health
      APP_OCR_LANGUAGE: es
      TZ: America/Argentina/Buenos_Aires
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      - paddleocr
    restart: unless-stopped

  paddleocr:
    build:
      context: .
      dockerfile: ocr/Dockerfile
    container_name: facturas-paddleocr
    environment:
      OCR_DEFAULT_LANGUAGE: es
      TZ: America/Argentina/Buenos_Aires
      FLAGS_use_mkldnn: "0"
      FLAGS_use_onednn: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      APP_OCR_DEBUG: ${APP_OCR_DEBUG:-false}
      OCR_DEBUG_DIR: /app/debug
    expose:
      - "5000"
    volumes:
      - paddleocr-cache:/root/.paddleocr
      - ./debug:/app/debug
    restart: unless-stopped

volumes:
  paddleocr-cache:
