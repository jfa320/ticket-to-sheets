# En ejecución nativa, solo esta PC. Compose sobrescribe la dirección dentro del contenedor.
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.max-image-pixels=20000000
app.upload.max-image-side=10000
app.pdf.max-pages=20
app.pdf.max-page-pixels=20000000
app.pdf.processing-budget-seconds=${APP_PDF_PROCESSING_BUDGET_SECONDS:300}
server.error.include-message=never
logging.level.com.opencode.facturas=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-sin-id}] %logger{36} - %msg%n

app.ocr.endpoint=http://127.0.0.1:5000/ocr
app.ocr.health-endpoint=http://127.0.0.1:5000/health
app.ocr.language=es
app.ocr.connect-timeout-ms=5000
app.ocr.read-timeout-ms=300000
app.ocr.health-timeout-ms=2000
# Reintentos breves: si PaddleOCR no arranca, el frontend debe mostrar el error
# en segundos en lugar de quedar aparentemente bloqueado durante varios minutos.
app.ocr.max-attempts=3
app.ocr.search-budget-seconds=${APP_OCR_SEARCH_BUDGET_SECONDS:8}

# Reglas locales opcionales de categorías; la edición por fila sigue siendo libre.
app.categories.path=${APP_CATEGORIES_PATH:data/categories.json}

# Integración opcional con Google Sheets: secretos y destino se guardan solo en data/.
app.google.client-id=${APP_GOOGLE_CLIENT_ID:}
app.google.client-secret=${APP_GOOGLE_CLIENT_SECRET:}
app.google.picker-api-key=${APP_GOOGLE_PICKER_API_KEY:}
app.google.app-id=${APP_GOOGLE_APP_ID:}
app.google.redirect-uri=${APP_GOOGLE_REDIRECT_URI:http://localhost:8080/api/sheets/oauth/callback}
app.google.tokens-path=${APP_GOOGLE_TOKENS_PATH:data/google-oauth-tokens.json}
app.sheets.config-path=${APP_SHEETS_CONFIG_PATH:data/sheets-config.json}
app.sheets.history-path=${APP_SHEETS_HISTORY_PATH:data/sheets-history.json}
app.sheets.local-history-path=${APP_LOCAL_HISTORY_PATH:data/local-history.json}
app.sheets.timeout-ms=${APP_SHEETS_TIMEOUT_MS:15000}
